name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release + npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Node for npm publish
        uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-gh-cli-build.js

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          MAJOR=$(echo "${BASE}" | cut -d. -f1)
          MINOR=$(echo "${BASE}" | cut -d. -f2)
          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set npm version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Check NPM_TOKEN is set
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN secret is not set. Add it via:"
          echo "  gh secret set NPM_TOKEN --repo sfroment/pi-gh-cli"
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target main \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Auto-release from commit ${{ github.sha }}" \
            --latest
