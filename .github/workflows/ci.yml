name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        # Retry: bun install can fail on truncated registry downloads.
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-gh-cli-build.js

      - name: Type-check
        run: bunx tsc --noEmit
